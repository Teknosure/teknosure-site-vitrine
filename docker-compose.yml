services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teknosure-app
    restart: always
    env_file:
      - .env        # PAYLOAD_SECRET
      - .env.local  # Azure Graph, Flowise, n8n…
    environment:
      # Surcharge la valeur de .env (127.0.0.1) : dans Docker, la base est le service "db".
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}@db:5432/${POSTGRES_DB:-teknosure-website}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads Payload (collection Media) persistés hors du conteneur
      - media_data:/app/media
    # Exposé uniquement en local : le reverse proxy / TLS est géré sur le serveur de prod
    ports:
      - "127.0.0.1:3000:3000"

  db:
    image: postgres:16-alpine
    container_name: teknosure-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-teknosure-website}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de "ports:" : la base n'est joignable que depuis le réseau Docker interne.

volumes:
  postgres_data:
  media_data:
